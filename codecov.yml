codecov:
  # Publish Codecov's status only after the repository-owned CI check finishes.
  # Branch protection separately requires codecov/project and codecov/patch.
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: 93%
        threshold: 0%
    patch:
      default:
        target: 93%
        threshold: 0%

ignore:
  - "__tests__/**"
  - "**/*.test.ts"
  - "scripts/**"
  - "src/index.ts"
  - "src/cli/bin.ts"
  - "src/core/pipeline-types.ts"
  - "src/kiro/types.ts"
  - "src/kiro/transform/streaming/types.ts"
  - "src/server/request-lifecycle.ts"
