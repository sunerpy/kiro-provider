# GitHub Actions updates only. Dependabot npm version updates do not update Bun
# bun.lock, so every generated PR fails the frozen-lockfile gate. Use `bun update`
# in a maintainer PR for dependency upgrades until the updater supports Bun locks.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    rebase-strategy: "disabled"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns: ["*"]
