name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify change
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release_pr: ${{ steps.change.outputs.release_pr }}
    steps:
      - name: Detect the trusted Release Please PR
        id: change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          release_pr=false
          if [ "$EVENT_NAME" = pull_request ] &&
            [ "$PR_AUTHOR" = 'github-actions[bot]' ] &&
            [ "$HEAD_REPOSITORY" = "$REPOSITORY" ] &&
            [ "$HEAD_REF" = 'release-please--branches--main--components--kiro-provider' ] &&
            [[ "$PR_TITLE" =~ ^chore:\ release\ [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            release_pr=true
          fi
          echo "release_pr=$release_pr" >>"$GITHUB_OUTPUT"
          echo "release_pr=$release_pr"

  linux:
    name: Linux gate
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun run scripts/check-pr-title.ts

      - name: Validate Release Please metadata-only delta
        if: needs.classify.outputs.release_pr == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bun run scripts/check-release-pr-delta.ts

      - name: Verify lockfile registry provenance
        if: needs.classify.outputs.release_pr != 'true'
        shell: bash
        run: |
          set -euo pipefail
          foreign_hosts=$(grep -oE 'https?://[^/\"]+' bun.lock | sort -u | grep -v '^https://registry.npmjs.org$' || true)
          if [ -n "$foreign_hosts" ]; then
            echo "::error file=bun.lock::bun.lock contains non-npmjs registry hosts"
            printf 'offending hosts:\n%s\n' "$foreign_hosts" >&2
            exit 1
          fi

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Run full project preflight
        if: needs.classify.outputs.release_pr != 'true'
        run: make pre-ci

      - name: Run release PR coverage gate
        if: needs.classify.outputs.release_pr == 'true'
        run: make coverage-gate coverage-parity

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          disable_search: true

  windows:
    name: Windows
    needs: classify
    if: needs.classify.result == 'success' && needs.classify.outputs.release_pr != 'true'
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  ci-success:
    name: CI Success
    needs: [classify, linux, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the selected CI path to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RELEASE_PR: ${{ needs.classify.outputs.release_pr }}
        run: |
          jq -e --arg release_pr "$RELEASE_PR" '
            .classify.result == "success" and
            .linux.result == "success" and
            (if $release_pr == "true"
             then .windows.result == "skipped"
             else .windows.result == "success"
             end)
          ' <<<"$NEEDS_JSON"
