# Same-run release for Node/Bun repositories: npm package and/or Bun-compiled CLI.
# Rendered destination: .github/workflows/release.yml (the filename is part of the
# npmjs.com trusted-publisher configuration; do not rename it).
#
# Topology (references/release.md, references/node.md):
#   release-please (version, tag, DRAFT release) -> verify (source gate, package
#   metadata, npm tarball) || build-binaries (optional Bun legs) -> upload-assets
#   (SHA256SUMS, attestation, draft upload, remote verification) -> npm-publish
#   (OIDC trusted publishing from the verified tarball, idempotent) ->
#   publish-release (verify remote bytes, flip draft, --latest unless prerelease).
#
# Invariants:
# - Nothing listens on `push: tags` or `release:`; GITHUB_TOKEN-created tags and
#   releases start no workflow runs, so every publication step is a same-run job.
# - The draft stays a draft when anything fails; the flip is the last step.
# - npm publish happens after asset upload and before the flip. It publishes the
#   tarball packed in `verify`, so no dependency code runs next to id-token: write.
# - Every external action is SHA-pinned; every checkout keeps persist-credentials
#   false; no inline expressions inside run: blocks; timeout-minutes on every job.
# - Shared scripts owned by the skill: .github/scripts/resolve-release-gate.sh
#   (gate, semver, tag peel, draft check, prerelease, release_sha) and
#   .github/scripts/publish-release-draft.sh (draft-safe lookup, remote byte
#   verification, flip).
#
# Switches (workflow env, exported as job outputs because job-level `if:` cannot
# read `env`):
#   BUILD_BINARIES   "true" to ship the five stable platform binaries
#   NPM_PUBLISH      "true" to publish to npmjs.com with OIDC trusted publishing
#   NPM_PUBLISH_MODE publish (direct) | stage (npm stage publish + 2FA approval)
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing draft release tag to rebuild, for example v1.2.3"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_MANAGER: bun
  BINARY_NAME: kiro-provider
  BUILD_BINARIES: "true"
  NPM_PUBLISH: "true"
  NPM_PUBLISH_MODE: publish
  # npm CLI used for publishing (>= 11.5.1 for trusted publishing, >= 11.15.0
  # for `npm stage`). This is the publish tool, not the project's runtime.
  NPM_CLI_VERSION: 11.19.1
  PUBLISH_NODE_VERSION: "24"

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      build_artifacts: ${{ steps.gate.outputs.build_artifacts }}
      tag_name: ${{ steps.gate.outputs.tag_name }}
      version: ${{ steps.gate.outputs.version }}
      prerelease: ${{ steps.gate.outputs.prerelease }}
      release_sha: ${{ steps.gate.outputs.release_sha }}
      build_binaries: ${{ steps.switches.outputs.build_binaries }}
      npm_publish: ${{ steps.switches.outputs.npm_publish }}
    steps:
      - name: Run release-please
        id: release
        if: github.event_name == 'push'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release tooling from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Export profile switches
        id: switches
        shell: bash
        run: |
          set -euo pipefail
          for value in "$BUILD_BINARIES" "$NPM_PUBLISH"; do
            case "$value" in
            true | false) ;;
            *)
              echo "::error::BUILD_BINARIES and NPM_PUBLISH must be \"true\" or \"false\""
              exit 1
              ;;
            esac
          done
          {
            echo "build_binaries=$BUILD_BINARIES"
            echo "npm_publish=$NPM_PUBLISH"
          } >>"$GITHUB_OUTPUT"

      - name: Resolve release gate
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          DEFAULT_BRANCH: main
        run: bash .github/scripts/resolve-release-gate.sh

  verify:
    name: Verify release tag
    needs: release-please
    if: needs.release-please.outputs.build_artifacts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Assert the tag resolves to the released commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_SHA" ]; then
            echo "::error::checked out $head but the release points at $RELEASE_SHA"
            exit 1
          fi

      - name: Set up Bun
        if: env.PACKAGE_MANAGER == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up pnpm
        if: env.PACKAGE_MANAGER == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json

      - name: Set up Node.js
        if: env.PACKAGE_MANAGER != 'bun'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: ${{ env.PACKAGE_MANAGER }}

      - name: Install dependencies (frozen lockfile)
        shell: bash
        run: |
          set -euo pipefail
          case "$PACKAGE_MANAGER" in
          npm) npm ci ;;
          pnpm) pnpm install --frozen-lockfile ;;
          bun) bun install --frozen-lockfile ;;
          *)
            echo "::error::PACKAGE_MANAGER must be npm, pnpm, or bun (got '$PACKAGE_MANAGER')"
            exit 1
            ;;
          esac

      - name: Run release preflight
        shell: bash
        run: make pre-ci

      - name: Verify package metadata against the release
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          NPM_PUBLISH_ENABLED: ${{ needs.release-please.outputs.npm_publish }}
        run: |
          set -euo pipefail
          pkg_version=$(jq -r '.version // empty' package.json)
          if [ "$pkg_version" != "$VERSION" ]; then
            echo "::error::package.json version '$pkg_version' does not equal release version '$VERSION'"
            exit 1
          fi
          if [ "$NPM_PUBLISH_ENABLED" = true ]; then
            name=$(jq -r '.name // empty' package.json)
            [ -n "$name" ] || { echo "::error::package.json has no name"; exit 1; }
            if [ "$(jq -r '.private // false' package.json)" = true ]; then
              echo "::error::package.json is private but NPM_PUBLISH is true"
              exit 1
            fi
            repo_url=$(jq -r '.repository.url // .repository // empty' package.json)
            case "$repo_url" in
            *"github.com/${GITHUB_REPOSITORY}"*) ;;
            *)
              echo "::error::repository.url '$repo_url' must contain github.com/${GITHUB_REPOSITORY} (case-sensitive) for npm provenance"
              exit 1
              ;;
            esac
          fi

      - name: Pack the npm tarball
        if: needs.release-please.outputs.npm_publish == 'true'
        shell: bash
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p npm-package
          case "$PACKAGE_MANAGER" in
          npm) npm pack --pack-destination npm-package ;;
          pnpm) pnpm pack --pack-destination npm-package ;;
          bun) bun pm pack --destination npm-package ;;
          esac
          shopt -s nullglob
          tarballs=(npm-package/*.tgz)
          if ((${#tarballs[@]} != 1)); then
            echo "::error::expected exactly one tarball in npm-package/, found ${#tarballs[@]}"
            exit 1
          fi
          tarball=${tarballs[0]}
          tar -xzOf "$tarball" package/package.json >npm-package/packed-package.json
          packed_version=$(jq -r '.version // empty' npm-package/packed-package.json)
          packed_name=$(jq -r '.name // empty' npm-package/packed-package.json)
          if [ "$packed_version" != "$VERSION" ]; then
            echo "::error::packed tarball version '$packed_version' does not equal '$VERSION'"
            exit 1
          fi
          printf '%s\n' "${packed_name}@${packed_version}" >npm-package/package-spec.txt
          (cd npm-package && sha256sum "$(basename "$tarball")" >tarball.sha256)
          cat npm-package/tarball.sha256

      - name: Upload the npm tarball for the publish job
        if: needs.release-please.outputs.npm_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: |
            npm-package/*.tgz
            npm-package/tarball.sha256
            npm-package/package-spec.txt
          retention-days: 1
          if-no-files-found: error

  build-binaries:
    name: Build ${{ matrix.asset }}
    needs: release-please
    if: >-
      needs.release-please.outputs.build_artifacts == 'true' &&
      needs.release-please.outputs.build_binaries == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            bun_target: bun-linux-x64
            platform: linux
            arch: x64
            asset: kiro-provider-linux-x64
          - runner: ubuntu-24.04-arm
            bun_target: bun-linux-arm64
            platform: linux
            arch: arm64
            asset: kiro-provider-linux-arm64
          - runner: macos-15-intel
            bun_target: bun-darwin-x64
            platform: macos
            arch: x64
            asset: kiro-provider-darwin-x64
          - runner: macos-15
            bun_target: bun-darwin-arm64
            platform: macos
            arch: arm64
            asset: kiro-provider-darwin-arm64
          - runner: windows-2025
            bun_target: bun-windows-x64
            platform: windows
            arch: x64
            asset: kiro-provider-windows-x64.exe
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Assert the tag resolves to the released commit
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          if [ "$head" != "$RELEASE_SHA" ]; then
            echo "::error::checked out $head but the release points at $RELEASE_SHA"
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Compile standalone binary
        shell: bash
        env:
          BUN_TARGET: ${{ matrix.bun_target }}
          OUTFILE: dist/${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bun build --compile --minify --target="$BUN_TARGET" src/cli/bin.ts --outfile "$OUTFILE"
          test -s "$OUTFILE"

      - name: Smoke packaged artifact on Linux or macOS
        if: matrix.platform != 'windows'
        shell: bash
        env:
          OUTFILE: dist/${{ matrix.asset }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          chmod +x "$OUTFILE"
          actual=$("$OUTFILE" --version)
          expected="kiro-provider ${VERSION}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::${OUTFILE} reported '${actual}', expected '${expected}'"
            exit 1
          fi

      - name: Smoke packaged artifact on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          OUTFILE: dist/${{ matrix.asset }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (& $env:OUTFILE --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expected = "kiro-provider $env:VERSION"
          if ($actual -ne $expected) {
            Write-Error "$env:OUTFILE reported '$actual', expected '$expected'"
            exit 1
          }

      - name: Upload smoked build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/${{ matrix.asset }}
          retention-days: 1
          if-no-files-found: error

  upload-assets:
    name: Attach release assets
    needs: [release-please, verify, build-binaries]
    if: >-
      needs.release-please.outputs.build_artifacts == 'true' &&
      needs.release-please.outputs.build_binaries == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release tooling from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -euo pipefail
          expected=(
            kiro-provider-darwin-arm64
            kiro-provider-darwin-x64
            kiro-provider-linux-arm64
            kiro-provider-linux-x64
            kiro-provider-windows-x64.exe
          )
          for asset in "${expected[@]}"; do
            test -s "$asset" || { echo "::error::missing or empty release asset: $asset"; exit 1; }
          done
          find . -maxdepth 1 -type f -name 'kiro-provider-*' -printf '%f\n' | LC_ALL=C sort >actual-assets.txt
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort >expected-assets.txt
          diff -u expected-assets.txt actual-assets.txt
          sha256sum "${expected[@]}" >SHA256SUMS
          cat SHA256SUMS

      # Attestation happens here, in a job that executes no project or dependency
      # code, so id-token: write never coexists with a build step.
      - name: Attest release binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attach assets to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/kiro-provider-* dist/SHA256SUMS)
          gh release upload "$TAG" "${files[@]}" --repo "$REPO" --clobber

      - name: Verify remote assets against SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          bash .github/scripts/publish-release-draft.sh --verify-only \
            --checksums dist/SHA256SUMS --expect-name SHA256SUMS --exact

      - name: Upload SHA256SUMS for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums
          path: dist/SHA256SUMS
          retention-days: 1
          if-no-files-found: error

  npm-publish:
    name: Publish to npm
    needs: [release-please, verify, upload-assets]
    if: >-
      always() && !cancelled() &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.build_artifacts == 'true' &&
      needs.release-please.outputs.npm_publish == 'true' &&
      needs.verify.result == 'success' &&
      (needs.release-please.outputs.build_binaries != 'true' || needs.upload-assets.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The OIDC subject becomes repo:OWNER/REPO:environment:release. The npmjs.com
    # trusted publisher must name this environment or leave the field blank.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, no install, no build: this job only publishes the tarball that
      # `verify` packed, so no dependency lifecycle script can reach the OIDC token.
      - name: Download the verified npm tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: npm-package

      - name: Verify the tarball digest
        shell: bash
        working-directory: npm-package
        run: |
          set -euo pipefail
          sha256sum -c tarball.sha256
          test -s package-spec.txt

      - name: Set up Node.js for the npm CLI
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PUBLISH_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin the npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global "npm@${NPM_CLI_VERSION}"
          installed=$(npm --version)
          if [ "$installed" != "$NPM_CLI_VERSION" ]; then
            echo "::error::npm ${installed} installed, expected ${NPM_CLI_VERSION}"
            exit 1
          fi

      - name: Publish with OIDC trusted publishing (idempotent)
        shell: bash
        env:
          PRERELEASE: ${{ needs.release-please.outputs.prerelease }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          spec=$(cat npm-package/package-spec.txt)
          case "$spec" in
          *"@${VERSION}") ;;
          *)
            echo "::error::package spec '$spec' does not end with @${VERSION}"
            exit 1
            ;;
          esac
          shopt -s nullglob
          tarballs=(npm-package/*.tgz)
          ((${#tarballs[@]} == 1)) || { echo "::error::expected one tarball"; exit 1; }
          tarball="./${tarballs[0]}"

          # Registry idempotence: exit 0 means the exact version already exists
          # (rerun after a partial failure); E404 means unpublished; anything
          # else is a registry or auth problem and must abort before the flip.
          set +e
          published=$(npm view "$spec" version --json 2>view.err)
          view_status=$?
          set -e
          if [ "$view_status" -eq 0 ] && [ -n "$published" ]; then
            echo "::notice::${spec} is already on the registry; skipping publish"
            exit 0
          fi
          if ! grep -q 'E404' view.err; then
            cat view.err >&2
            echo "::error::npm view ${spec} failed for a reason other than E404"
            exit 1
          fi

          args=(--access public --ignore-scripts)
          if [ "$PRERELEASE" = true ]; then
            args+=(--tag next)
          fi
          npm publish "$tarball" --dry-run "${args[@]}"
          case "$NPM_PUBLISH_MODE" in
          publish)
            npm publish "$tarball" "${args[@]}"
            ;;
          stage)
            npm stage publish "$tarball" "${args[@]}"
            echo "::notice::${spec} staged; a maintainer must approve it with 2FA"
            ;;
          *)
            echo "::error::NPM_PUBLISH_MODE must be publish or stage"
            exit 1
            ;;
          esac

      - name: Confirm the version is visible on the registry
        if: env.NPM_PUBLISH_MODE == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          spec=$(cat npm-package/package-spec.txt)
          for _ in 1 2 3 4 5 6; do
            if npm view "$spec" version >/dev/null 2>&1; then
              echo "${spec} is visible on the registry"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${spec} is not visible on the registry after publish"
          exit 1

  publish-release:
    name: Publish Release
    needs: [release-please, verify, build-binaries, upload-assets, npm-publish]
    if: >-
      always() && !cancelled() &&
      needs.release-please.result == 'success' &&
      needs.release-please.outputs.build_artifacts == 'true' &&
      needs.verify.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.release-please.outputs.build_binaries != 'true' || needs.upload-assets.result == 'success') &&
      (needs.release-please.outputs.npm_publish != 'true' || needs.npm-publish.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout release tooling from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download SHA256SUMS
        if: needs.release-please.outputs.build_binaries == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums
          path: checksums

      - name: Verify remote assets and publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          BINARIES_SHIPPED: ${{ needs.release-please.outputs.build_binaries }}
        run: |
          set -euo pipefail
          args=(--publish)
          if [ "$BINARIES_SHIPPED" = true ]; then
            args+=(--checksums checksums/SHA256SUMS --expect-name SHA256SUMS --exact)
          fi
          bash .github/scripts/publish-release-draft.sh "${args[@]}"
