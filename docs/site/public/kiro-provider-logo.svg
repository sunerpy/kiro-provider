<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="kiro-provider">
  <!-- A request (the orange dot) inside the loopback brackets of [::1], the gateway's local
       boundary, drawn on FirLab's navy app tile in its pale and orange marks. The same drawing
       is the catalog icon on firlab.app (AppIcon.astro). -->
  <rect width="100" height="100" rx="22" fill="#0B1220" />
  <path d="M40 28 H30 V72 H40" fill="none" stroke="#E7EDF5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M60 28 H70 V72 H60" fill="none" stroke="#E7EDF5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="50" cy="50" r="7" fill="#F97316" />
</svg>
